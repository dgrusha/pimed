name: CI

# Runs the whole project's checks on every pull request (and on pushes to main).
# Also reused by release.yml so nothing is released without passing tests.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (check, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Formatting (prettier)
        run: npm run lint
      - name: Build static SPA
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: backend/web/dist
          retention-days: 1
          if-no-files-found: error

  backend:
    name: Backend (fmt, vet, test -race)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Test against the real embedded frontend, like the shipped binary.
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: backend/web/dist
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        run: go test -race -count=1 ./...
      - name: Cross-compile for Raspberry Pi (linux/arm64, static)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/pimed

  installer:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck install.sh
        run: shellcheck install.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag pimed:ci .
      - name: Smoke test
        run: |
          docker run -d --name pimed -p 127.0.0.1:8080:8080 -e PIMED_COOKIE_SECURE=false pimed:ci
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/setup/status | grep -q '"needsSetup":true'
          curl -sf -o /dev/null http://127.0.0.1:8080/
      - name: Container logs
        if: always()
        run: docker logs pimed || true
