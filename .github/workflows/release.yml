name: Release

# Push a version tag to publish a GitHub Release with ready-to-run binaries:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.2.0-rc.1) become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # create the release and upload assets
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build binaries and archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            name="pimed_linux_${arch}"
            stage="dist/${name}"
            mkdir -p "${stage}/deploy"
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "../${stage}/pimed" ./cmd/pimed)
            cp deploy/pimed.service deploy/pimed.env deploy/Caddyfile "${stage}/deploy/"
            cp README.md "${stage}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${VERSION}" --verify-tag --generate-notes ${prerelease} \
            --title "PiMed ${VERSION}" \
            dist/pimed_linux_arm64.tar.gz dist/pimed_linux_amd64.tar.gz dist/checksums.txt install.sh
