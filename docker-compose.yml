# PiMed: backend (Go, with the SvelteKit SPA embedded) + Caddy in front.
#   docker compose up -d --build
# Settings come from .env (see .env.example). See README.md → "Running with Docker".

services:
  pimed:
    build: .
    image: pimed:latest
    restart: unless-stopped
    environment:
      PIMED_COOKIE_SECURE: ${PIMED_COOKIE_SECURE:-false}
      PIMED_SESSION_TTL: ${PIMED_SESSION_TTL:-720h}
      PIMED_LOG_LEVEL: ${PIMED_LOG_LEVEL:-info}
      # Only Caddy (fixed address below) may set X-Forwarded-For.
      PIMED_TRUSTED_PROXIES: 172.30.0.10
    volumes:
      # Files/media root. Point PIMED_DATA_PATH at a host dir (e.g. an HDD mount) to use it.
      - ${PIMED_DATA_PATH:-pimed-data}:/data
      - pimed-db:/var/lib/pimed
    networks: [pimed]
    # No "ports:" on purpose — the backend is reachable only through Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pimed]
    environment:
      PIMED_SITE: ${PIMED_SITE:-:80}
    ports:
      - "${PIMED_BIND_IP:-0.0.0.0}:${PIMED_HTTP_PORT:-80}:80"
      - "${PIMED_BIND_IP:-0.0.0.0}:${PIMED_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      pimed:
        ipv4_address: 172.30.0.10

networks:
  pimed:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pimed-data:
  pimed-db:
  caddy-data:
  caddy-config:
